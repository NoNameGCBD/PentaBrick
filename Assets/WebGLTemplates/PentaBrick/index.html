<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>{{{ PRODUCT_NAME }}} · 3D Puzzle</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f172a; }
    #unity-canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; touch-action: none; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; pointer-events: none; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); transition: opacity .25s ease; }
    #loading h1 { color: #e8eaee; font-size: clamp(28px, 6vw, 48px); font-weight: 900; letter-spacing: .04em; margin: 0; text-shadow: 0 4px 0 #020617; }
    .blocks { display: flex; justify-content: center; gap: 8px; }
    .blocks i { display: block; width: 24px; height: 24px; border-radius: 6px; border-top: 2px solid #ffffff55; box-shadow: 0 5px 0 #0005; animation: hop 1.2s ease-in-out infinite; }
    .blocks i:nth-child(1) { background: #e5484d; }
    .blocks i:nth-child(2) { background: #f08c2e; animation-delay: .1s; }
    .blocks i:nth-child(3) { background: #f2c94c; animation-delay: .2s; }
    .blocks i:nth-child(4) { background: #3fb56b; animation-delay: .3s; }
    .blocks i:nth-child(5) { background: #3b82f6; animation-delay: .4s; }
    .progress { width: min(280px, 70vw); height: 6px; border-radius: 6px; overflow: hidden; margin: auto; background: #020617; }
    #progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #61d8e8, #8be99a); transition: width .2s ease; }
    #status { max-width: 80vw; margin: 0; color: #a7b4c7; font-size: 13px; }
    @keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 35% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .blocks i { animation: none; } #loading, #progress-fill { transition: none; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="PentaBrick 3D 블록 퍼즐. Q 놓기, W 칠하기, E 지우기, 숫자 1부터 6까지 색 선택."></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div class="blocks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <h1>PENTA BRICK</h1>
    <div class="progress" role="progressbar" aria-label="게임 로딩" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
    <p id="status">퍼즐 작업대를 준비하고 있어요…</p>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const progress = document.querySelector('.progress');
    const fill = document.getElementById('progress-fill');
    const config = {
      arguments: [],
#if PROGRESSIVE_ASSET_LOADING
      primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
      secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: (message, type) => {
        if (type === 'error') { loading.style.display = 'grid'; loading.style.opacity = '1'; status.textContent = message; }
        else console.warn(message);
      }
    };
    createUnityInstance(canvas, config, value => {
      const percent = Math.round(value * 100);
      fill.style.width = percent + '%';
      progress.setAttribute('aria-valuenow', String(percent));
    }).then(() => {
      loading.style.opacity = '0';
      loading.setAttribute('aria-hidden', 'true');
      setTimeout(() => { loading.style.display = 'none'; }, 250);
      canvas.focus();
    }).catch(error => {
      status.textContent = '게임을 불러오지 못했습니다. 새로고침해 주세요. ' + String(error);
    });
    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
